<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Employee Onboarding - Code Origin.Ai Private Limited</title>
<style>
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --primary-light: #e8f0fe;
  --success: #0f9d58;
  --danger: #d93025;
  --warning: #f9ab00;
  --bg: #f0f2f5;
  --white: #ffffff;
  --text: #202124;
  --text-muted: #5f6368;
  --border: #dadce0;
  --shadow: 0 2px 10px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1a237e, #1a73e8);
  color: white; padding: 18px 30px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 20px rgba(26,115,232,0.3);
}
.header .logo-area { display: flex; align-items: center; gap: 14px; }
.header .logo-area .logo-icon {
  width: 46px; height: 46px; background: rgba(255,255,255,0.15);
  border-radius: 10px; display: grid; place-items: center;
  font-size: 20px; font-weight: 800;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.header .header-actions { display: flex; gap: 10px; }
.btn {
  padding: 10px 18px; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #0b8043; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #b3261e; }
.btn-outline { background: white; color: var(--primary); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--primary-light); }
.btn-white { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); }
.btn-white:hover { background: rgba(255,255,255,0.3); }
.container { max-width: 1300px; margin: 0 auto; padding: 24px; }
.stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat-card {
  background: var(--white); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); border-left: 4px solid var(--primary);
}
.stat-card .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card.green { border-left-color: var(--success); }
.stat-card.green .stat-num { color: var(--success); }
.stat-card.orange { border-left-color: var(--warning); }
.stat-card.orange .stat-num { color: var(--warning); }
.card {
  background: var(--white); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header h2 { font-size: 16px; font-weight: 600; }
.card-body { padding: 24px; }
.search-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.search-bar input {
  flex: 1; min-width: 200px; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; outline: none; transition: border 0.2s;
}
.search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
.table-wrap { overflow-x: auto; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: #f8f9fa; padding: 12px 14px; text-align: left;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-muted); font-weight: 600; border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 12px 14px; border-bottom: 1px solid #f0f0f0;
  font-size: 13px; vertical-align: middle;
}
tbody tr:hover { background: var(--primary-light); }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.badge-active { background: #e6f4ea; color: var(--success); }
.badge-pending { background: #fef7e0; color: #e37400; }
.badge-inactive { background: #fce8e6; color: var(--danger); }
.action-btns { display: flex; gap: 6px; }
.action-btns button {
  width: 30px; height: 30px; border: 1px solid var(--border);
  border-radius: 6px; background: white; cursor: pointer;
  display: grid; place-items: center; font-size: 14px;
  transition: all 0.2s;
}
.action-btns button:hover { background: var(--primary-light); border-color: var(--primary); }
.action-btns button.del:hover { background: #fce8e6; border-color: var(--danger); }

/* Modal / Form */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white; border-radius: var(--radius); width: 100%;
  max-width: 800px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: white; z-index: 1;
}
.modal-header h2 { font-size: 18px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: #f0f0f0; cursor: pointer; font-size: 18px;
  display: grid; place-items: center;
}
.modal-close:hover { background: #e0e0e0; }
.modal-body { padding: 24px; }
.form-section { margin-bottom: 24px; }
.form-section h3 {
  font-size: 14px; font-weight: 600; color: var(--primary);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--primary-light);
}
.form-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
.form-group input, .form-group select, .form-group textarea {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; outline: none; font-family: inherit; transition: border 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
  position: sticky; bottom: 0; background: white;
}
.tab-nav {
  display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px;
}
.tab-btn {
  padding: 12px 20px; background: none; border: none; border-bottom: 2px solid transparent;
  margin-bottom: -2px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-muted); transition: all 0.2s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-btn:hover { color: var(--text); background: var(--primary-light); }
.view-card {
  background: var(--white); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.view-card h3 {
  font-size: 14px; color: var(--primary); margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 1px solid var(--primary-light);
}
.view-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px;
}
.view-field { display: flex; flex-direction: column; gap: 2px; }
.view-field .field-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
.view-field .field-value { font-size: 14px; font-weight: 500; }
.avatar-lg {
  width: 70px; height: 70px; border-radius: 50%;
  background: linear-gradient(135deg, #1a73e8, #6c5ce7);
  display: grid; place-items: center; color: white;
  font-size: 24px; font-weight: 700;
}
.profile-header {
  display: flex; align-items: center; gap: 18px; margin-bottom: 24px;
  padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.profile-header .info h2 { font-size: 22px; }
.profile-header .info p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
@media (max-width: 768px) {
  .header { flex-direction: column; gap: 12px; text-align: center; }
  .container { padding: 16px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ============ DATA LAYER (localStorage) ============
const STORAGE_KEY = 'codeorigin_employees';

function getEmployees() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveEmployees(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function generateId() { return 'EMP' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,4).toUpperCase(); }

// ============ EXCEL EXPORT ============
function exportToExcel() {
  const employees = getEmployees();
  if (!employees.length) { alert('No employee records to export.'); return; }
  const headers = [
    'Employee ID','Full Name','Date of Birth','Gender','Marital Status','Blood Group',
    'Phone','Email','Personal Email','Address','City','State','Pincode','Country',
    'Aadhar Number','PAN Number','Passport Number','Driving License',
    'Department','Designation','Date of Joining','Employment Type','Reporting Manager',
    'Work Location','Employee Status','Probation End Date',
    'Previous Company','Previous Designation','Total Experience (Years)',
    'Highest Qualification','University','Year of Passing',
    'Emergency Contact Name','Emergency Contact Relation','Emergency Contact Phone',
    'Offer Letter Issued','ID Card Issued','NDA Signed','Laptop Assigned','Laptop Serial',
    'Official Email Provided','Slack/Teams Added','Notes'
  ];
  let csv = headers.map(h => `"${h}"`).join(',') + '\n';
  employees.forEach(e => {
    const row = [
      e.empId, e.fullName, e.dob, e.gender, e.maritalStatus, e.bloodGroup,
      e.phone, e.email, e.personalEmail, e.address, e.city, e.state, e.pincode, e.country,
      e.aadhar, e.pan, e.passport, e.drivingLicense,
      e.department, e.designation, e.doj, e.employmentType, e.reportingManager,
      e.workLocation, e.status, e.probationEnd,
      e.prevCompany, e.prevDesignation, e.totalExp,
      e.qualification, e.university, e.yearOfPassing,
      e.emergencyName, e.emergencyRelation, e.emergencyPhone,
      e.offerLetter?'Yes':'No', e.idCard?'Yes':'No', e.ndaSigned?'Yes':'No',
      e.laptopAssigned?'Yes':'No', e.laptopSerial,
      e.officialEmail, e.slackAdded?'Yes':'No', e.notes
    ];
    csv += row.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `CodeOriginAi_Employees_${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
}

// ============ APP STATE ============
let currentView = 'list'; // list | form | detail
let editingId = null;
let viewingId = null;
let searchTerm = '';
let filterStatus = 'all';

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + '<div class="container">' + renderContent() + '</div>' + renderModal();
}

function renderHeader() {
  const emp = getEmployees();
  return `
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">CO</div>
        <div>
          <h1>Code Origin.Ai Private Limited</h1>
          <div class="subtitle">Employee Onboarding &amp; Records Management System</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-white" onclick="exportToExcel()">&#x1f4e5; Export to Excel</button>
        <button class="btn btn-white" onclick="openForm()">&#x2795; Add Employee</button>
      </div>
    </header>
  `;
}

function renderContent() {
  if (currentView === 'detail') return renderDetail();
  return renderStats() + renderList();
}

function renderStats() {
  const emp = getEmployees();
  const active = emp.filter(e => e.status === 'Active').length;
  const probation = emp.filter(e => e.status === 'Probation').length;
  const thisMonth = emp.filter(e => {
    if (!e.doj) return false;
    const d = new Date(e.doj);
    const now = new Date();
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).length;
  return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${emp.length}</div><div class="stat-label">Total Employees</div></div>
      <div class="stat-card green"><div class="stat-num">${active}</div><div class="stat-label">Active Employees</div></div>
      <div class="stat-card orange"><div class="stat-num">${probation}</div><div class="stat-label">On Probation</div></div>
      <div class="stat-card"><div class="stat-num">${thisMonth}</div><div class="stat-label">Joined This Month</div></div>
    </div>
  `;
}

function renderList() {
  let emp = getEmployees();
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    emp = emp.filter(e => e.fullName.toLowerCase().includes(s) || e.empId.toLowerCase().includes(s) ||
      (e.department||'').toLowerCase().includes(s) || (e.designation||'').toLowerCase().includes(s));
  }
  if (filterStatus !== 'all') emp = emp.filter(e => e.status === filterStatus);

  const rows = emp.length ? emp.map(e => `
    <tr>
      <td><strong>${e.empId}</strong></td>
      <td>${e.fullName}</td>
      <td>${e.department || '-'}</td>
      <td>${e.designation || '-'}</td>
      <td>${e.doj || '-'}</td>
      <td>${e.phone || '-'}</td>
      <td><span class="badge badge-${e.status==='Active'?'active':e.status==='Probation'?'pending':'inactive'}">${e.status}</span></td>
      <td>
        <div class="action-btns">
          <button title="View" onclick="viewEmployee('${e.id}')">&#x1f441;</button>
          <button title="Edit" onclick="editEmployee('${e.id}')">&#x270f;&#xfe0f;</button>
          <button title="Delete" class="del" onclick="deleteEmployee('${e.id}')">&#x1f5d1;</button>
        </div>
      </td>
    </tr>
  `).join('') : `<tr><td colspan="8"><div class="empty-state"><div class="icon">&#x1f4cb;</div><p>No employees found. Click "Add Employee" to get started.</p></div></td></tr>`;

  return `
    <div class="card">
      <div class="card-header">
        <h2>Employee Records</h2>
      </div>
      <div class="card-body">
        <div class="search-bar">
          <input type="text" placeholder="Search by name, ID, department..." value="${searchTerm}" oninput="searchTerm=this.value;render()"/>
          <select onchange="filterStatus=this.value;render()" class="btn btn-outline" style="padding:10px 14px;font-size:13px;">
            <option value="all" ${filterStatus==='all'?'selected':''}>All Status</option>
            <option value="Active" ${filterStatus==='Active'?'selected':''}>Active</option>
            <option value="Probation" ${filterStatus==='Probation'?'selected':''}>Probation</option>
            <option value="Inactive" ${filterStatus==='Inactive'?'selected':''}>Inactive</option>
            <option value="Resigned" ${filterStatus==='Resigned'?'selected':''}>Resigned</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Emp ID</th><th>Name</th><th>Department</th><th>Designation</th>
              <th>Date of Joining</th><th>Phone</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderDetail() {
  const emp = getEmployees().find(e => e.id === viewingId);
  if (!emp) { currentView = 'list'; render(); return ''; }
  const initials = emp.fullName.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  return `
    <button class="btn btn-outline" onclick="currentView='list';render()" style="margin-bottom:16px;">&#x2190; Back to List</button>
    <div class="profile-header" style="background:white;padding:24px;border-radius:var(--radius);box-shadow:var(--shadow);">
      <div class="avatar-lg">${initials}</div>
      <div class="info">
        <h2>${emp.fullName}</h2>
        <p>${emp.designation || 'N/A'} &middot; ${emp.department || 'N/A'} &middot; ID: ${emp.empId}</p>
        <p style="margin-top:4px;"><span class="badge badge-${emp.status==='Active'?'active':emp.status==='Probation'?'pending':'inactive'}">${emp.status}</span></p>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="editEmployee('${emp.id}')">&#x270f;&#xfe0f; Edit</button>
        <button class="btn btn-danger" onclick="deleteEmployee('${emp.id}')">&#x1f5d1; Delete</button>
      </div>
    </div>
    <div class="view-card"><h3>Personal Information</h3><div class="view-grid">
      ${vf('Full Name',emp.fullName)}${vf('Date of Birth',emp.dob)}${vf('Gender',emp.gender)}
      ${vf('Marital Status',emp.maritalStatus)}${vf('Blood Group',emp.bloodGroup)}${vf('Phone',emp.phone)}
      ${vf('Official Email',emp.email)}${vf('Personal Email',emp.personalEmail)}
    </div></div>
    <div class="view-card"><h3>Address</h3><div class="view-grid">
      ${vf('Address',emp.address)}${vf('City',emp.city)}${vf('State',emp.state)}
      ${vf('Pincode',emp.pincode)}${vf('Country',emp.country)}
    </div></div>
    <div class="view-card"><h3>Identity &amp; Documents</h3><div class="view-grid">
      ${vf('Aadhar Number',emp.aadhar)}${vf('PAN Number',emp.pan)}
      ${vf('Passport Number',emp.passport)}${vf('Driving License',emp.drivingLicense)}
    </div></div>
    <div class="view-card"><h3>Employment Details</h3><div class="view-grid">
      ${vf('Department',emp.department)}${vf('Designation',emp.designation)}
      ${vf('Date of Joining',emp.doj)}${vf('Employment Type',emp.employmentType)}
      ${vf('Reporting Manager',emp.reportingManager)}${vf('Work Location',emp.workLocation)}
      ${vf('Status',emp.status)}${vf('Probation End Date',emp.probationEnd)}
    </div></div>
    <div class="view-card"><h3>Previous Experience</h3><div class="view-grid">
      ${vf('Previous Company',emp.prevCompany)}${vf('Previous Designation',emp.prevDesignation)}
      ${vf('Total Experience',emp.totalExp ? emp.totalExp+' years' : '')}
    </div></div>
    <div class="view-card"><h3>Education</h3><div class="view-grid">
      ${vf('Highest Qualification',emp.qualification)}${vf('University',emp.university)}
      ${vf('Year of Passing',emp.yearOfPassing)}
    </div></div>
    <div class="view-card"><h3>Emergency Contact</h3><div class="view-grid">
      ${vf('Contact Name',emp.emergencyName)}${vf('Relation',emp.emergencyRelation)}
      ${vf('Phone',emp.emergencyPhone)}
    </div></div>
    <div class="view-card"><h3>Onboarding Checklist</h3><div class="view-grid">
      ${vf('Offer Letter Issued',emp.offerLetter?'Yes':'No')}${vf('ID Card Issued',emp.idCard?'Yes':'No')}
      ${vf('NDA Signed',emp.ndaSigned?'Yes':'No')}${vf('Laptop Assigned',emp.laptopAssigned?'Yes':'No')}
      ${vf('Laptop Serial No.',emp.laptopSerial)}${vf('Official Email Provided',emp.officialEmail)}
      ${vf('Slack/Teams Added',emp.slackAdded?'Yes':'No')}
    </div></div>
    ${emp.notes ? `<div class="view-card"><h3>Notes</h3><p style="font-size:14px;color:var(--text-muted);">${emp.notes}</p></div>` : ''}
  `;
}

function vf(label, value) {
  return `<div class="view-field"><span class="field-label">${label}</span><span class="field-value">${value || 'N/A'}</span></div>`;
}

function renderModal() {
  return `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">Add New Employee</h2>
          <button class="modal-close" onclick="closeForm()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="empForm" onsubmit="saveForm(event)">
            <div class="form-section"><h3>&#x1f464; Personal Information</h3>
              <div class="form-grid">
                <div class="form-group"><label>Full Name *</label><input type="text" id="f_fullName" required/></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" id="f_dob"/></div>
                <div class="form-group"><label>Gender</label><select id="f_gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                <div class="form-group"><label>Marital Status</label><select id="f_maritalStatus"><option value="">Select</option><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option></select></div>
                <div class="form-group"><label>Blood Group</label><select id="f_bloodGroup"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
                <div class="form-group"><label>Phone *</label><input type="tel" id="f_phone" required/></div>
                <div class="form-group"><label>Official Email</label><input type="email" id="f_email"/></div>
                <div class="form-group"><label>Personal Email</label><input type="email" id="f_personalEmail"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f3e0; Address</h3>
              <div class="form-grid">
                <div class="form-group" style="grid-column:1/-1;"><label>Address</label><textarea id="f_address" rows="2"></textarea></div>
                <div class="form-group"><label>City</label><input type="text" id="f_city"/></div>
                <div class="form-group"><label>State</label><input type="text" id="f_state"/></div>
                <div class="form-group"><label>Pincode</label><input type="text" id="f_pincode"/></div>
                <div class="form-group"><label>Country</label><input type="text" id="f_country" value="India"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f4c4; Identity &amp; Documents (No Bank Details)</h3>
              <div class="form-grid">
                <div class="form-group"><label>Aadhar Number</label><input type="text" id="f_aadhar" maxlength="12"/></div>
                <div class="form-group"><label>PAN Number</label><input type="text" id="f_pan" maxlength="10" style="text-transform:uppercase;"/></div>
                <div class="form-group"><label>Passport Number</label><input type="text" id="f_passport"/></div>
                <div class="form-group"><label>Driving License</label><input type="text" id="f_drivingLicense"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f3e2; Employment Details</h3>
              <div class="form-grid">
                <div class="form-group"><label>Department *</label><input type="text" id="f_department" required/></div>
                <div class="form-group"><label>Designation *</label><input type="text" id="f_designation" required/></div>
                <div class="form-group"><label>Date of Joining *</label><input type="date" id="f_doj" required/></div>
                <div class="form-group"><label>Employment Type</label><select id="f_employmentType"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Intern</option></select></div>
                <div class="form-group"><label>Reporting Manager</label><input type="text" id="f_reportingManager"/></div>
                <div class="form-group"><label>Work Location</label><input type="text" id="f_workLocation"/></div>
                <div class="form-group"><label>Employee Status</label><select id="f_status"><option>Active</option><option>Probation</option><option>Inactive</option><option>Resigned</option></select></div>
                <div class="form-group"><label>Probation End Date</label><input type="date" id="f_probationEnd"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f4bc; Previous Experience</h3>
              <div class="form-grid">
                <div class="form-group"><label>Previous Company</label><input type="text" id="f_prevCompany"/></div>
                <div class="form-group"><label>Previous Designation</label><input type="text" id="f_prevDesignation"/></div>
                <div class="form-group"><label>Total Experience (Years)</label><input type="number" id="f_totalExp" min="0" step="0.5"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f393; Education</h3>
              <div class="form-grid">
                <div class="form-group"><label>Highest Qualification</label><input type="text" id="f_qualification"/></div>
                <div class="form-group"><label>University/Institute</label><input type="text" id="f_university"/></div>
                <div class="form-group"><label>Year of Passing</label><input type="number" id="f_yearOfPassing" min="1980" max="2030"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f6a8; Emergency Contact</h3>
              <div class="form-grid">
                <div class="form-group"><label>Contact Name</label><input type="text" id="f_emergencyName"/></div>
                <div class="form-group"><label>Relation</label><input type="text" id="f_emergencyRelation"/></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="f_emergencyPhone"/></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x2705; Onboarding Checklist</h3>
              <div class="form-grid">
                <div class="form-group"><label><input type="checkbox" id="f_offerLetter"/> Offer Letter Issued</label></div>
                <div class="form-group"><label><input type="checkbox" id="f_idCard"/> ID Card Issued</label></div>
                <div class="form-group"><label><input type="checkbox" id="f_ndaSigned"/> NDA Signed</label></div>
                <div class="form-group"><label><input type="checkbox" id="f_laptopAssigned"/> Laptop Assigned</label></div>
                <div class="form-group"><label>Laptop Serial No.</label><input type="text" id="f_laptopSerial"/></div>
                <div class="form-group"><label>Official Email Provided</label><input type="email" id="f_officialEmail"/></div>
                <div class="form-group"><label><input type="checkbox" id="f_slackAdded"/> Slack/Teams Added</label></div>
              </div>
            </div>
            <div class="form-section"><h3>&#x1f4dd; Additional Notes</h3>
              <div class="form-group"><textarea id="f_notes" rows="3" placeholder="Any additional notes about the employee..."></textarea></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline" onclick="closeForm()">Cancel</button>
              <button type="submit" class="btn btn-primary">&#x1f4be; Save Employee</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
}

// ============ FORM ACTIONS ============
function openForm(id) {
  editingId = id || null;
  render();
  const modal = document.getElementById('modalOverlay');
  modal.style.display = 'flex';
  document.getElementById('modalTitle').textContent = id ? 'Edit Employee' : 'Add New Employee';
  if (id) {
    const emp = getEmployees().find(e => e.id === id);
    if (emp) populateForm(emp);
  }
}

function closeForm() {
  document.getElementById('modalOverlay').style.display = 'none';
  editingId = null;
}

function populateForm(emp) {
  const fields = ['fullName','dob','gender','maritalStatus','bloodGroup','phone','email','personalEmail',
    'address','city','state','pincode','country','aadhar','pan','passport','drivingLicense',
    'department','designation','doj','employmentType','reportingManager','workLocation','status','probationEnd',
    'prevCompany','prevDesignation','totalExp','qualification','university','yearOfPassing',
    'emergencyName','emergencyRelation','emergencyPhone','laptopSerial','officialEmail','notes'];
  fields.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (el) el.value = emp[f] || '';
  });
  const checks = ['offerLetter','idCard','ndaSigned','laptopAssigned','slackAdded'];
  checks.forEach(f => {
    const el = document.getElementById('f_' + f);
    if (el) el.checked = !!emp[f];
  });
}

function saveForm(e) {
  e.preventDefault();
  const employees = getEmployees();
  const data = {
    id: editingId || generateId(),
    empId: '',
    fullName: document.getElementById('f_fullName').value.trim(),
    dob: document.getElementById('f_dob').value,
    gender: document.getElementById('f_gender').value,
    maritalStatus: document.getElementById('f_maritalStatus').value,
    bloodGroup: document.getElementById('f_bloodGroup').value,
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    personalEmail: document.getElementById('f_personalEmail').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    state: document.getElementById('f_state').value.trim(),
    pincode: document.getElementById('f_pincode').value.trim(),
    country: document.getElementById('f_country').value.trim(),
    aadhar: document.getElementById('f_aadhar').value.trim(),
    pan: document.getElementById('f_pan').value.trim().toUpperCase(),
    passport: document.getElementById('f_passport').value.trim(),
    drivingLicense: document.getElementById('f_drivingLicense').value.trim(),
    department: document.getElementById('f_department').value.trim(),
    designation: document.getElementById('f_designation').value.trim(),
    doj: document.getElementById('f_doj').value,
    employmentType: document.getElementById('f_employmentType').value,
    reportingManager: document.getElementById('f_reportingManager').value.trim(),
    workLocation: document.getElementById('f_workLocation').value.trim(),
    status: document.getElementById('f_status').value,
    probationEnd: document.getElementById('f_probationEnd').value,
    prevCompany: document.getElementById('f_prevCompany').value.trim(),
    prevDesignation: document.getElementById('f_prevDesignation').value.trim(),
    totalExp: document.getElementById('f_totalExp').value,
    qualification: document.getElementById('f_qualification').value.trim(),
    university: document.getElementById('f_university').value.trim(),
    yearOfPassing: document.getElementById('f_yearOfPassing').value,
    emergencyName: document.getElementById('f_emergencyName').value.trim(),
    emergencyRelation: document.getElementById('f_emergencyRelation').value.trim(),
    emergencyPhone: document.getElementById('f_emergencyPhone').value.trim(),
    offerLetter: document.getElementById('f_offerLetter').checked,
    idCard: document.getElementById('f_idCard').checked,
    ndaSigned: document.getElementById('f_ndaSigned').checked,
    laptopAssigned: document.getElementById('f_laptopAssigned').checked,
    laptopSerial: document.getElementById('f_laptopSerial').value.trim(),
    officialEmail: document.getElementById('f_officialEmail').value.trim(),
    slackAdded: document.getElementById('f_slackAdded').checked,
    notes: document.getElementById('f_notes').value.trim(),
  };

  if (editingId) {
    const idx = employees.findIndex(x => x.id === editingId);
    if (idx > -1) { data.empId = employees[idx].empId; employees[idx] = data; }
  } else {
    data.empId = 'CO-' + String(employees.length + 1).padStart(4, '0');
    employees.push(data);
  }

  saveEmployees(employees);
  closeForm();
  currentView = 'list';
  render();
}

function viewEmployee(id) {
  viewingId = id;
  currentView = 'detail';
  render();
}

function editEmployee(id) {
  currentView = 'list';
  render();
  openForm(id);
}

function deleteEmployee(id) {
  if (!confirm('Are you sure you want to delete this employee record? This cannot be undone.')) return;
  const employees = getEmployees().filter(e => e.id !== id);
  saveEmployees(employees);
  if (currentView === 'detail' && viewingId === id) currentView = 'list';
  render();
}

// ============ INIT ============
render();
</script>
</body>
</html>
